
name: Chaos-Master CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets a branch exercise the main-only jobs (the full suite, and health)
  # before it is merged, instead of finding out on main.
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    # Type-aware linting (typescript-eslint strictTypeChecked + projectService)
    # holds the whole TS program in memory; on this codebase peak is ~2.5GB, which
    # OOMs Node's ~2GB default heap. The runner has 16GB, so lift the ceiling well
    # clear of the peak rather than throttling CI. Applies to every step (tsc and
    # vitest build the same program). See eslint.config.js (docs content files are
    # already dropped to syntax-only linting to trim peak).
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    # Full history: the scoped pull-request test run diffs the working tree
    # against the base commit, and the default shallow clone has neither the
    # base commit nor the branch history to reach it.
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: 📦 Install all dependencies
      id: install
      run: |
        corepack enable
        pnpm install

    # Also writes the full report to eslint-report.json, which the metrics
    # step below reads to ratchet the eslint_* keys without a second
    # type-aware pass (scripts/eslint-report-formatter.mjs). The log shows the
    # usual stylish output.
    - name: 🧹 Lint code
      run: pnpm lint --format ./scripts/eslint-report-formatter.mjs
      env:
        ESLINT_JSON_REPORT: eslint-report.json

    - name: 🔍 Type check
      run: pnpm typecheck

    # Everything, on main and on a manual run. This is the run that decides
    # whether main is green.
    - name: 🧪 Run tests
      if: github.event_name != 'pull_request'
      run: pnpm test

    # On a pull request: core and mobile-runtime in full (a second, together),
    # and the app suite scoped to what the branch touched plus a list of tests
    # that read the source tree through the filesystem and so cannot be scoped.
    # See scripts/test-changed.mjs and packages/app/TESTING.md.
    - name: Run tests scoped to the pull request
      if: github.event_name == 'pull_request'
      run: pnpm test:pr
      env:
        TEST_CHANGED_BASE: ${{ github.event.pull_request.base.sha }}

    - name: 🛠️ Build project
      run: pnpm --filter chaos-master run build

    # The landing site has no tests, which is defensible for a marketing page.
    # Not building it is not: nothing else in CI compiles it.
    - name: Build landing
      run: pnpm --filter @chaos-master/landing run build

    - name: 🎭 Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium

    # The chromium-ci Playwright project: every *.ci.spec.ts, i.e. the specs
    # that hold on the software WebGPU (swiftshader) GitHub runners provide.
    # The rest of tests/ is not enforced here (see packages/app/TESTING.md).
    # A skip in this project fails the run.
    - name: Run CI-safe e2e
      run: pnpm test:e2e:ci

    # The module graph and the metrics ratchet, on pull requests too since
    # WP3b (2026-09-23): a cycle, an orphan, an impure core import, a bucket
    # count or a per-file cap that got worse fails the change that did it, not
    # main after the merge. 2.5 s and 0.9 s. They run last, and whatever
    # failed above them, so a red step above never hides theirs and theirs
    # never hides a test. `pnpm arch` needs Node 22, 24 or 26+ (the matrix is
    # 24) and resolves `@/` through tsconfig.depcruise.json. The eslint_* keys
    # come from the lint step's report, so a new warning or a more complex
    # function fails the pull request that adds it; a lint step that wrote no
    # report fails this step too. Coverage is measured in `health`.
    - name: Check the module graph for cycles, orphans and core purity
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: pnpm arch

    - name: Check the code metrics ratchet, the lint keys and the per-file caps
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: pnpm metrics:check --lint-report=eslint-report.json

    - name: 📎 Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

  # Every `file:line` citation in a living doc must still point at the symbol
  # it names (scripts/check-doc-citations.mjs; the rules are in
  # docs/agent/CONVENTIONS.md section 9). It runs on pull requests too, unlike
  # the ratchets below: a citation goes stale in the change that moves the
  # code, and that change's author is the one who knows where it went. Nothing
  # about it is a judgement call to defer to main. It is a job of its own so a
  # stale line number never hides a failing test, nor the other way round. It
  # needs full history, for citations pinned to an old revision, and no
  # install: the script uses node and git only, and takes under a second.
  citations:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Check the file:line citations in the docs
      run: node scripts/check-doc-citations.mjs

  # The code-health checks that are too slow for every pull request, on main
  # and on a manual run only: the metrics ratchet with the coverage keys, which
  # need a coverage run. `pnpm arch` and the ratchet with the lint keys run in
  # `build`, on every pull request (WP3b, 2026-09-23). They sit in their own job so that a ratchet failure can never
  # hide a test failure in `build`, and so the branch that fixes a ratchet is
  # obvious from the job that went red.
  health:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install all dependencies
      run: |
        corepack enable
        pnpm install

    # Both scripts walk packages/ and read files. Neither builds a TypeScript
    # program, so the raised heap the build job needs is not needed here.
    - name: Check the generated agent index is current
      run: pnpm docs:index:check

    # Writes packages/{app,core}/coverage-audit/coverage-summary.json, which
    # is what gives the six coverage_* keys a value. Without it the ratchet
    # skips them, and nothing in CI held a coverage floor. The app suite
    # builds the same program as the build job, so it gets the same heap.
    # Instrumented, the whole-tree scans run slower: the first run of this step
    # timed out eagerComputationOrder.test.ts's in-file scan at 5.5 s against
    # vitest's 5 s default (1.5 s for the whole file without coverage), so
    # `pnpm test:coverage` gives the app suite a 30 s test timeout.
    - name: Measure coverage
      run: pnpm test:coverage
      env:
        NODE_OPTIONS: --max-old-space-size=6144

    # With the coverage summaries above, the six coverage_* keys are compared
    # too. The eslint_* keys are not measured here: `build` holds them on every
    # pull request and push, from its lint step's report, and a second
    # type-aware pass here would cost 1m45s for the same numbers.
    - name: Check the code metrics ratchet, coverage keys included
      run: pnpm metrics:check

    # dependency-cruiser over packages/app/src and packages/core/src
    # (.dependency-cruiser.cjs): import cycles, orphan modules and core's
    # purity are errors. It needs Node 22, 24 or 26+, which this job pins, and
    # it resolves `@/` through tsconfig.depcruise.json; without that file the
    # graph loses most of its edges and the cycle rule passes vacuously.
    - name: Check the module graph for cycles and orphans
      run: pnpm arch


